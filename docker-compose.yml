services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: neuro-support:latest
    container_name: neuro-support
    restart: unless-stopped
    environment:
      ENV: production
      PYTHONUNBUFFERED: "1"
      LOGURU_LEVEL: INFO
      JIVO_ENABLED: "false"
    # Keep the web UI private. Administrators can use an SSH tunnel.
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      # Includes SQLite, FAISS, integration settings, and editable knowledge.
      - ./data:/app/data
      - ./logs:/app/logs
      # The settings UI updates this file; bind it so changes survive recreation.
      - ./.env:/app/.env
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1200M
        reservations:
          cpus: "0.5"
          memory: 384M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - neuro-net

  # Optional public HTTP reverse proxy. TLS is not configured here; configure
  # certificates and HTTPS separately before exposing an admin interface.
  nginx:
    image: nginx:alpine
    container_name: neuro-nginx
    restart: unless-stopped
    profiles: ["reverse-proxy"]
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      app:
        # Admin UI must remain reachable through the proxy while the first
        # FAISS index is being created (health is 503 until then).
        condition: service_started
    networks:
      - neuro-net

networks:
  neuro-net:
    driver: bridge
